name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos (tsc)
        run: npm run typecheck
      - name: Pruebas
        run: npm test
      - name: Pruebas del paquete documentos-es (con umbral de cobertura)
        run: npm run test:paquete
      - name: Paquete documentos-es empaquetado (instala el .tgz, lo importa y comprueba los tipos)
        run: npm run verificar:paquete
      - name: Build de producción
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Navegador para Playwright
        run: npx playwright install --with-deps chromium
      - name: Pruebas end-to-end (build de producción, sin peticiones a otros orígenes)
        run: npm run e2e
      - name: Trazas de las pruebas fallidas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trazas
          path: test-results/
          retention-days: 7
